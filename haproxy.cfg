global
    log stdout format raw local0

    # LAB ONLY: exposes HAProxy Runtime API over TCP
    stats socket ipv4@0.0.0.0:9999 level admin

defaults
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    timeout queue 5s

frontend fe_http
    bind *:8080

    # Global carrier TPS bucket.
    # Tracks accepted requests over a 5-second rolling window.
    stick-table type string size 100k expire 15s store http_req_rate(5s)

    # Read dynamic capacity from capacity.map.
    # capacity.map: carriers 100
    http-request set-var(req.rate_limit) int(1),map_int(/usr/local/etc/haproxy/capacity.map,100)

    # Read current accepted request rate for the same logical key.
    http-request set-var(req.request_rate) str(carriers),table_http_req_rate()

    # If current request rate is higher than the dynamic limit, rate_abuse=true.
    acl rate_abuse var(req.rate_limit),sub(req.request_rate) lt 0

    # Only count accepted requests so rejected 429s do not poison the counter.
    http-request track-sc0 str(carriers) unless rate_abuse

    # Reject excess traffic before it reaches the carrier backends.
    http-request deny deny_status 429 if rate_abuse

    default_backend carriers

backend carriers
    balance roundrobin

    option httpchk GET /health
    http-check expect status 200

    server tmobile-sdg1 tmobile-sdg1:8080 check inter 2s fall 2 rise 2
    server tmobile-sdg2 tmobile-sdg2:8080 check inter 2s fall 2 rise 2

listen stats
    bind *:8404
    stats enable
    stats uri /
