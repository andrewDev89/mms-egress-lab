services:
  haproxy:
    image: haproxy:latest
    ports:
      - "8080:8080"
      - "8404:8404"
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./capacity.map:/usr/local/etc/haproxy/capacity.map:ro
    depends_on:
      - carrier1
      - carrier2

  carrier1:
    image: nginx:latest

  carrier2:
    image: nginx:latest

  haproxy-exporter:
    image: quay.io/prometheus/haproxy-exporter:latest
    command:
      - "--haproxy.scrape-uri=http://haproxy:8404/;csv"
    ports:
      - "9101:9101"
    depends_on:
      - haproxy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - haproxy-exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
