services:
  psql-mms:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mms
      POSTGRES_PASSWORD: mms
      POSTGRES_DB: psql_mms
    ports:
      - "15432:5432"
    volumes:
      - psql-mms-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mms -d psql_mms"]
      interval: 5s
      timeout: 3s
      retries: 20

  mms-api:
    build: .
    environment:
      DATABASE_URL: postgresql://mms:mms@psql-mms:5432/psql_mms
      CARRIERS: tmobile-sdg1,tmobile-sdg2
      TMOBILE_SDG1_URL: http://tmobile-sdg1:8080
      TMOBILE_SDG2_URL: http://tmobile-sdg2:8080
    ports:
      - "8000:8000"
    depends_on:
      psql-mms:
        condition: service_healthy
      tmobile-sdg1:
        condition: service_started
      tmobile-sdg2:
        condition: service_started

  worker-tmobile-sdg1:
    build: .
    command: ["python", "-m", "mms_queue.worker"]
    environment:
      DATABASE_URL: postgresql://mms:mms@psql-mms:5432/psql_mms
      CARRIERS: tmobile-sdg1,tmobile-sdg2
      WORKER_CARRIER: tmobile-sdg1
      WORKER_ID: worker-tmobile-sdg1
      WORKER_METRICS_PORT: 9102
      TMOBILE_SDG1_URL: http://tmobile-sdg1:8080
      TMOBILE_SDG2_URL: http://tmobile-sdg2:8080
    depends_on:
      psql-mms:
        condition: service_healthy
      tmobile-sdg1:
        condition: service_started

  worker-tmobile-sdg2:
    build: .
    command: ["python", "-m", "mms_queue.worker"]
    environment:
      DATABASE_URL: postgresql://mms:mms@psql-mms:5432/psql_mms
      CARRIERS: tmobile-sdg1,tmobile-sdg2
      WORKER_CARRIER: tmobile-sdg2
      WORKER_ID: worker-tmobile-sdg2
      WORKER_METRICS_PORT: 9102
      TMOBILE_SDG1_URL: http://tmobile-sdg1:8080
      TMOBILE_SDG2_URL: http://tmobile-sdg2:8080
    depends_on:
      psql-mms:
        condition: service_healthy
      tmobile-sdg2:
        condition: service_started

  haproxy:
    image: haproxy:latest
    ports:
      - "8080:8080"
      - "8404:8404"
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./capacity.map:/usr/local/etc/haproxy/capacity.map:ro
    depends_on:
      - tmobile-sdg1
      - tmobile-sdg2

  tmobile-sdg1:
    build: .
    command: ["uvicorn", "mms_queue.carrier_mock:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      CARRIER_NAME: tmobile-sdg1

  tmobile-sdg2:
    build: .
    command: ["uvicorn", "mms_queue.carrier_mock:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      CARRIER_NAME: tmobile-sdg2

  haproxy-exporter:
    image: quay.io/prometheus/haproxy-exporter:latest
    command:
      - "--haproxy.scrape-uri=http://haproxy:8404/;csv"
    ports:
      - "9101:9101"
    depends_on:
      - haproxy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - haproxy-exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  psql-mms-data:
  prometheus-data:
  grafana-data:
