services:
  psql-mms:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mms
      POSTGRES_PASSWORD: mms
      POSTGRES_DB: psql_mms
    ports:
      - "15432:5432"
    volumes:
      - psql-mms-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mms -d psql_mms"]
      interval: 5s
      timeout: 3s
      retries: 20

  mms-api:
    build: .
    labels:
      mms.logs: mmsc
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql://mms:mms@psql-mms:5432/psql_mms
      CARRIERS: tmobile-sdg1,tmobile-sdg2
      HAPROXY_RUNTIME_HOST: haproxy
      HAPROXY_RUNTIME_PORT: 9999
      TMOBILE_SDG1_URL: http://tmobile-sdg1:8080
      TMOBILE_SDG2_URL: http://tmobile-sdg2:8080
    ports:
      - "8000:8000"
    depends_on:
      mbuni:
        condition: service_healthy
      psql-mms:
        condition: service_healthy
      tmobile-sdg1:
        condition: service_started
      tmobile-sdg2:
        condition: service_started
      haproxy:
        condition: service_started

  db-init:
    build: .
    command: ["python", "-m", "mms_queue.db"]
    environment:
      DATABASE_URL: postgresql://mms:mms@psql-mms:5432/psql_mms
    depends_on:
      psql-mms:
        condition: service_healthy

  mbuni:
    build:
      context: .
      dockerfile: mbuni/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MBUNI_SEND_TPS: ${MBUNI_SEND_TPS:-600}
      MBUNI_MAX_SEND_ATTEMPTS: ${MBUNI_MAX_SEND_ATTEMPTS:-100}
      SEND_ATTEMPT_BACK_OFF_SECONDS: ${SEND_ATTEMPT_BACK_OFF_SECONDS:-2}
    volumes:
      - mbuni-spool:/var/spool/mbuni
      - ${MBUNI_LOG_DIR:-./logs/mbuni}:/var/log/mbuni
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:10002/status?password=lab-admin"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      db-init:
        condition: service_completed_successfully
      haproxy:
        condition: service_started

  haproxy:
    image: haproxy:latest
    ports:
      - "8080:8080"
      - "8404:8404"
      - "9999:9999"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./capacity.map:/usr/local/etc/haproxy/capacity.map:ro
    depends_on:
      - tmobile-sdg1
      - tmobile-sdg2

  tmobile-sdg1:
    build: .
    command: ["uvicorn", "mms_queue.carrier_mock:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      CARRIER_NAME: tmobile-sdg1

  tmobile-sdg2:
    build: .
    command: ["uvicorn", "mms_queue.carrier_mock:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      CARRIER_NAME: tmobile-sdg2

  haproxy-exporter:
    image: quay.io/prometheus/haproxy-exporter:latest
    command:
      - "--haproxy.scrape-uri=http://haproxy:8404/;csv"
    ports:
      - "9101:9101"
    depends_on:
      - haproxy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - haproxy-exporter

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started

  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mms-egress-lab}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${MBUNI_LOG_DIR:-./logs/mbuni}:/var/log/mbuni:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

volumes:
  mbuni-spool:
  psql-mms-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
